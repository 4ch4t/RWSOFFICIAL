<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridge Weather Service · Severe weather for Europe</title>
<meta name="description" content="Ridge Weather Service: severe weather warnings, convective outlooks and live radar for Europe.">
<meta name="theme-color" content="#050506">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23050506'/%3E%3Cpath d='M6 34 L18 16 L24 25 L31 12 L42 34 Z' fill='%23ff2b2b'/%3E%3Cpath d='M12 40 Q24 31 36 40' fill='none' stroke='%23ff2b2b' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; }
  #rws { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .wait { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
    color: #9a9aa5; font: 15px/1.7 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  .wait b { display: block; color: #f1f1f3; font-size: 18px; letter-spacing: 3px; }
  .wait a { color: #ff2b2b; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<!-- shown while the live site loads, and if it can't be reached -->
<div class="wait"><div><b>RWS</b>Loading Ridge Weather Service…<br>
  Taking too long? <a id="direct" href="https://rws-feeds.tailcddc44.ts.net:8443/live">Open the live site</a></div></div>
<iframe id="rws" title="Ridge Weather Service" allow="fullscreen; geolocation"></iframe>
<noscript><div class="wait"><div><b>RWS</b>
  <a href="https://rws-feeds.tailcddc44.ts.net:8443/live">Open Ridge Weather Service</a></div></div></noscript>
<script>
  // The live site runs on Tailscale. To move it, change BASE (and the two links above).
  (function () {
    var BASE = "https://rws-feeds.tailcddc44.ts.net:8443";
    var PAGES = ["live", "radar", "forecast", "warnings"];
    // always open /live, unless the address ends in one of the known pages (e.g. .../radar)
    var last = location.pathname.split("/").filter(Boolean).pop() || "";
    var page = PAGES.indexOf(last) >= 0 ? last : "live";
    var url = BASE + "/" + page;
    var frame = document.getElementById("rws");
    frame.src = url;
    document.getElementById("direct").href = url;
    // hide the loading text once the site is there, so it never shows through
    frame.addEventListener("load", function () { document.querySelector(".wait").style.display = "none"; });
  })();
</script>
</body>
</html>
